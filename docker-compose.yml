services:
  database:
    image: postgres:16-alpine
    container_name: dd-finance-database
    environment:
      POSTGRES_USER: dd_finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dd-finance-local}
      POSTGRES_DB: dd_finance
    ports:
      - "5432:5432"
    volumes:
      - dd-finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dd_finance -d dd_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dd-finance-postgres-data:
